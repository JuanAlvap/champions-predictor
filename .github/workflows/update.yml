name: Actualizar jornada

# Se dispara desde el botón "Actualizar" de la app (o a mano desde la pestaña Actions).
on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  analizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Correr modelo y agente de noticias
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m predictor.pipeline
      - name: Guardar resultados en el repo
        run: |
          git config user.name "parleys-bot"
          git config user.email "parleys-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Datos de jornada $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash || true
          git push
      - name: Armar sitio
        run: |
          mkdir -p _site
          cp -r web/* _site/
          cp -r data _site/data
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  publicar:
    needs: analizar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
